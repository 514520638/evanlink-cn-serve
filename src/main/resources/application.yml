server:
  port: 8080

spring:
  config:
    import: "optional:file:.env[.properties]"
  application:
    name: evanlink-cn-serve
  
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/evanlink_cn?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  servlet:
    multipart:
      # 相册采用有界二进制上传，禁用自动 multipart 临时文件。
      enabled: false

logging:
  level:
    com.evanlink: debug
    org.hibernate.SQL: debug

app:
  upload:
    dir: uploads
  admin:
    username: ${APP_ADMIN_USERNAME:}
    password: ${APP_ADMIN_PASSWORD:}
